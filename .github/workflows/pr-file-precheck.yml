name: File Precheck

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-file-precheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  SIZE_LIMIT_MB: 5
  MARKER: "<!-- cubesandbox-file-precheck:v1 -->"

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout base (trusted root)
        uses: actions/checkout@v6
        with:
          # Default ref for pull_request_target is the base branch.
          # Do NOT checkout the PR head into the workspace root.
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Detect oversized or binary files
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          limit_bytes=$((SIZE_LIMIT_MB * 1024 * 1024))
          head_ref="refs/remotes/origin/pr-head"

          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:${head_ref}"

          allowlisted() {
            case "$1" in
              deploy/one-click/assets/bin/mkcert-v1.4.4-*|Cubelet/contrib/unsquashfs|Cubelet/contrib/unsquashfs-dio)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          human_size() {
            local bytes=$1
            local -a units=(B KB MB GB TB)
            local i=0
            local val=${bytes}
            while (( val >= 1024 && i < 4 )); do
              val=$(( val / 1024 ))
              i=$(( i + 1 ))
            done
            printf '%s %s' "${val}" "${units[${i}]}"
          }

          findings=""
          while IFS=$'\t' read -r status file previous_file; do
            [[ -z "${file}" ]] && continue
            workflow_file="${file}"
            case "${workflow_file}" in
              .github/workflows/*)
                ;;
              *)
                workflow_file="${previous_file}"
                ;;
            esac
            case "${workflow_file}" in
              .github/workflows/*)
                echo "::warning file=${file},title=File Precheck::CI workflow changed; verify it does not weaken checks"
                findings+="- **${file}** — CI workflow changed, review needed"$'\n'
                ;;
            esac
            if allowlisted "${file}"; then
              continue
            fi
            blob="${head_ref}:${file}"
            if [[ "${status}" != "removed" ]] && git cat-file -e "${blob}" 2>/dev/null; then
              size=$(git cat-file -s "${blob}")
              if (( size > limit_bytes )); then
                msg="${file}: ${size} bytes exceeds the ${SIZE_LIMIT_MB} MB precheck limit"
                echo "::warning file=${file},title=File Precheck::${msg}"
                findings+="- **${file}** — $(human_size "${size}"), over the ${SIZE_LIMIT_MB} MB limit"$'\n'
              fi
              if [[ $(git cat-file blob "${blob}" 2>/dev/null | head -c 8000 | tr -d '\000' | wc -c) -lt $(git cat-file blob "${blob}" 2>/dev/null | head -c 8000 | wc -c) ]]; then
                msg="${file}: detected as binary/blob; build artifacts should not be committed"
                echo "::warning file=${file},title=File Precheck::${msg}"
                findings+="- **${file}** — binary file"$'\n'
              fi
            fi
          done < <(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv')

          printf '%s' "${findings}" > /tmp/precheck-findings.txt
          if [[ -s /tmp/precheck-findings.txt ]]; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Update precheck comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          comments_file="$(mktemp)"
          if ! gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("'"${MARKER}"'")) | [.id, (.body | @base64)] | @tsv' \
            > "${comments_file}"; then
            echo "::warning title=File Precheck::Could not list existing File Precheck comments"
            exit 0
          fi
          mapfile -t existing < "${comments_file}"
          if [[ "${{ steps.detect.outputs.found }}" == "true" ]]; then
            {
              echo "${MARKER}"
              echo ""
              echo "## File Precheck"
              echo ""
              echo "The following files may need attention:"
              echo ""
              cat /tmp/precheck-findings.txt
              echo ""
              echo "If they are intentional, a short note is enough. Otherwise, please remove them."
            } > "${body_file}"
          elif (( ${#existing[@]} > 0 )); then
            {
              echo "${MARKER}"
              echo ""
              echo "## File Precheck"
              echo ""
              echo "No suspicious files found in the latest revision."
              echo ""
              echo "Previous findings, if any, have been resolved."
            } > "${body_file}"
          else
            exit 0
          fi

          current_comment=""
          for comment in "${existing[@]}"; do
            IFS=$'\t' read -r comment_id encoded_body <<< "${comment}"
            printf '%s' "${encoded_body}" | base64 --decode > /tmp/precheck-existing-comment.txt
            if cmp -s "${body_file}" /tmp/precheck-existing-comment.txt; then
              current_comment="${comment_id}"
            fi
          done

          if [[ -z "${current_comment}" ]]; then
            # Create the latest status first so a posting failure cannot remove
            # the previous result. The snapshot contains only this workflow's
            # bot comments, identified by both author and the exclusive marker.
            gh pr comment "${PR_NUMBER}" --body-file "${body_file}"
          fi

          for comment in "${existing[@]}"; do
            IFS=$'\t' read -r comment_id _ <<< "${comment}"
            [[ "${comment_id}" == "${current_comment}" ]] && continue
            if ! gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${comment_id}"; then
              echo "::warning title=File Precheck::Could not remove an older File Precheck comment"
            fi
          done
